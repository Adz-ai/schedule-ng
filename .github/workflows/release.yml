name: Release

# Publishes to PyPI when a version tag such as v1.3.0 is pushed.
# Uses PyPI trusted publishing: no API token is stored in the repository.
# Set it up once at https://pypi.org/manage/account/publishing/ with
# workflow "release.yml" and environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Never build a release from a cache another workflow could have written.
          enable-cache: false
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('schedule_ng/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Runs after the PyPI upload, so a GitHub release only appears once the
  # version is on PyPI. The files are signed with Sigstore so they can be
  # verified without trusting GitHub's download servers.
  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release
      id-token: write # sign with Sigstore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          # Only applies to release events; the next step uploads the files.
          release-signing-artifacts: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          Changelog: https://schedule-ng.readthedocs.io/en/latest/changelog.html

          The files below are signed with [Sigstore](https://www.sigstore.dev/). To verify one:

          \`\`\`
          pip install sigstore
          python -m sigstore verify identity schedule_ng-${TAG#v}-py3-none-any.whl --cert-oidc-issuer https://token.actions.githubusercontent.com --cert-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG
          \`\`\`
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "schedule-ng ${TAG#v}" --notes-file notes.md
