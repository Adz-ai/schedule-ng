name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (without pytz)
        run: uv run --no-group dev --with pytest --with "tzdata; sys_platform == 'win32'" pytest
      - name: Tests (with pytz)
        run: uv run pytest --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --only-group docs --with-editable . sphinx-build -W -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - run: uvx twine check --strict dist/*

  # A single check for branch protection to require, so the protection rule
  # doesn't need updating when the test matrix changes.
  ci-ok:
    if: always()
    needs: [test, lint, docs, build]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
